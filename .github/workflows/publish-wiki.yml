name: Publish wiki

# T1 prototype (#922). Manual trigger only. T3 adds the live trigger:
#   push:
#     branches: [master]
#     paths: [docs/user/**, scripts/build-wiki.mjs, .github/workflows/publish-wiki.yml]
# together with a guard for the real repository.
on:
  workflow_dispatch:
    inputs:
      source-folder:
        description: Folder to publish to the wiki
        default: docs/wiki-prototype
        required: true

concurrency:
  group: publish-wiki
  cancel-in-progress: true

# The default GITHUB_TOKEN needs contents: write to push to <repo>.wiki.git.
permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Flatten pages, strip front matter, rewrite links, add Edit links.
      - run: node scripts/build-wiki.mjs "$SOURCE_FOLDER" .wiki-build
        env:
          SOURCE_FOLDER: ${{ inputs.source-folder }}
      # v5.0.6. Its own preprocessing is off: build-wiki.mjs does that work.
      - uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e
        with:
          path: .wiki-build
          preprocess: false
